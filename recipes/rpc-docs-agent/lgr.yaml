name: blockvectra-rh-docs-demo
harness: claude-code
model:
  name: tensorblock/claude-sonnet-5-5
instructions: ./AGENTS.md
files: []
secrets: []
mcp_servers:
  - name: blockvectra-docs
    command: npm
    args:
      - exec
      - --yes
      - --package
      - https://github.com/blockvectra/mcp/releases/download/v0.1.1/blockvectra-mcp-0.1.1.tgz
      - --
      - blockvectra-docs-mcp
egress:
  allow:
    - github.com
    - release-assets.githubusercontent.com
    - registry.npmjs.org
    - docs.blockvectra.com
limits:
  max_minutes: 2
  max_turns: 6
  max_cost_usd: 0.10
improvement:
  mode: "off"
